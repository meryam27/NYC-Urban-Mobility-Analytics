version: 2

models:
  - name: dim_zone
    columns:
      - name: location_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_payment_type
    columns:
      - name: payment_type
        tests: [unique, not_null]

  - name: fact_trips
    tests:
      - dbt_utils.expression_is_true:
          expression: "total_amount >= 0"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          expression: "duration_min >= 0 and duration_min < 1440"
    columns:
      - name: pickup_at
        tests: [not_null]
      - name: pickup_date
        tests: [not_null]
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zone')
              field: location_id
              config:
                severity: warn
      - name: payment_type
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]
              quote: false
