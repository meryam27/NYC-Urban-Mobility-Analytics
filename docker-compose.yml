x-airflow: &airflow
  build: ./airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
  depends_on: [postgres]

services:
  postgres:
    image: postgres:16
    environment:
      {
        POSTGRES_USER: airflow,
        POSTGRES_PASSWORD: airflow,
        POSTGRES_DB: airflow,
      }
    volumes: [pgdata:/var/lib/postgresql/data]
  airflow-init:
    <<: *airflow
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.com"
  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
  airflow-scheduler:
    <<: *airflow
    command: scheduler
  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    volumes: [mbdata:/metabase-data]
    environment: { MB_DB_FILE: /metabase-data/metabase.db }
volumes:
  pgdata: {}
  mbdata: {}
